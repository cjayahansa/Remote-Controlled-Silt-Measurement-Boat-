<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Underwater Distance Mesher</title>
  <style>
    :root{
      --bg:#0b1220; --panel:#0f1724; --accent:#06b6d4; --muted:#9aa6b2; --glass: rgba(255,255,255,0.04);
      --radius:12px;
    }
    *{box-sizing:border-box;font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
    body{margin:0;background:linear-gradient(180deg,#021027 0%, #061226 100%);color:#e6eef6;}
    .app{display:grid;grid-template-columns:360px 1fr;gap:18px;padding:18px;height:100vh}
    .panel{background:var(--panel);border-radius:var(--radius);padding:14px;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
    h1{margin:0 0 8px 0;font-size:18px}
    label{display:block;font-size:12px;color:var(--muted);margin-top:10px}
    input[type=text], input[type=number], select{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:var(--glass);color:inherit}
    .row{display:flex;gap:8px;align-items:center}
    button{background:var(--accent);border:none;padding:8px 12px;border-radius:8px;color:#002;cursor:pointer}
    button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
    .controls{display:flex;flex-direction:column}
    .small{font-size:12px;color:var(--muted)}
    .canvas-wrap{display:flex;flex-direction:column;height:100%;gap:12px}
    #meshCanvas{width:100%;height:70%;border-radius:12px;background:linear-gradient(180deg, rgba(6,18,34,0.6), rgba(2,6,23,0.6));}
    #plotCanvas{width:100%;height:28%;border-radius:8px;background:linear-gradient(180deg, rgba(3,10,18,0.3), rgba(4,8,12,0.2));}
    .footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
    .status{font-size:13px}
    .legend{display:flex;gap:8px;align-items:center}
    .colorbar{width:160px;height:10px;border-radius:6px;background:linear-gradient(90deg,#003e5c,#0284c7,#06b6d4,#a7f3d0)}
    @media (max-width:900px){.app{grid-template-columns:1fr;grid-auto-rows:auto;height:auto;padding:12px}}
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <h1>Underwater Distance Mesher</h1>
      <div class="controls">
        <label>Data source</label>
        <select id="sourceSelect">
          <option value="sim">Simulated (demo)</option>
          <option value="ws">WebSocket</option>
          <option value="http">HTTP (POST)</option>
        </select>

        <label id="wsUrlLabel">WebSocket URL</label>
        <input id="wsUrl" type="text" placeholder="ws://localhost:8080" value="ws://localhost:8080" />

        <div style="display:flex;gap:8px;margin-top:8px">
          <button id="connectBtn">Connect</button>
          <button id="simulateBtn" class="ghost">Start Sim</button>
        </div>

        <label>Scan settings</label>
        <div class="row">
          <input id="angleCount" type="number" min="8" max="1024" value="180" />
          <div style="flex:1;margin-left:6px" class="small">angles</div>
        </div>
        <label>Range limits (meters)</label>
        <div class="row">
          <input id="minRange" type="number" value="0.2" step="0.1" />
          <input id="maxRange" type="number" value="50" step="0.1" />
        </div>

        <label>Update rate</label>
        <input id="rate" type="number" value="5" min="1" max="60" />

        <label>Display</label>
        <div class="row" style="margin-top:6px">
          <button id="toggleGrid" class="ghost">Toggle Grid</button>
          <button id="resetBtn" class="ghost">Reset View</button>
        </div>

        <div style="margin-top:14px" class="small">Expected WebSocket message (JSON):</div>
        <pre style="font-size:12px;background:#071026;padding:8px;border-radius:8px;margin-top:8px;color:#9fd8ea">{
  "timestamp": 1690000000,
  "angle_start": -90,
  "angle_step": 1,
  "distances": [1.2, 1.25, 1.3, ...]
}</pre>
        <div style="margin-top:10px" class="small">Or a single-range message for multi-beam: {"distance":2.34}</div>
      </div>
    </div>

    <div class="panel canvas-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="status">Status: <span id="statusText">idle</span></div>
        <div class="legend"><div class="colorbar"></div><div class="small">shallow → deep</div></div>
      </div>

      <canvas id="meshCanvas"><
